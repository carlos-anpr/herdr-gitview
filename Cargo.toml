[package]
name = "herdr-gitview"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Visor de commits, diffs, Pull Requests de GitHub y Merge Requests de GitLab con explicaciones de IA, como plugin de herdr"

[dependencies]
anyhow = "1"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
