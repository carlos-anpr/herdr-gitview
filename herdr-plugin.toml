id = "local.gitview"
name = "gitview"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]
description = "Visor de commits, ramas y Merge Requests de GitLab estilo Git Graph, con explicaciones de IA."

# Compila el binario al instalar (requiere cargo). Con `herdr plugin link .` compílalo tú: `cargo build --release`.
[[build]]
command = ["cargo", "build", "--release", "--locked"]

# Ventana flotante (popup) sobre el panel activo; se cierra al salir del visor.
[[panes]]
id = "viewer"
title = "gitview"
placement = "popup"
width = "94%"
height = "92%"
command = ["sh", "-c", "exec \"${HERDR_PLUGIN_ROOT}/target/release/herdr-gitview\""]

[[actions]]
id = "open"
title = "gitview: control de cambios del proyecto"
contexts = ["pane", "workspace"]
command = ["sh", "herdr/open.sh"]
